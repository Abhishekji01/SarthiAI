name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ['27017:27017']
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017

  web:
    name: Web app (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: sarthiai-web
          path: web/dist

  android:
    name: Android APK (debug)
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      # Set the repository variable SARTHI_API_URL (e.g. https://your-sarthiai-server) to bake in your API.
      # Without it the app points at http://10.0.2.2:4000 (a dev server on the emulator's host) and can be changed in-app.
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.SARTHI_API_URL }}
      - run: npx cap sync android
        env:
          CAP_ALLOW_HTTP: ${{ vars.SARTHI_API_URL == '' && '1' || '0' }}
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: sarthiai-android-debug-apk
          path: web/android/app/build/outputs/apk/debug/*.apk
